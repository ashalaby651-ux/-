<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج المصروفات اليومية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .total {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #dc3545;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>المصروفات اليومية</h2>
    
    <div class="form-group">
        <label for="title">بيان المصروف:</label>
        <input type="text" id="title" placeholder="مثال: غداء، مواصلات...">
    </div>
    
    <div class="form-group">
        <label for="amount">المبلغ (ج.م):</label>
        <input type="number" id="amount" placeholder="0.00">
    </div>
    
    <div class="form-group">
        <label for="category">التصنيف:</label>
        <select id="category">
            <option value="طعام">طعام</option>
            <option value="مواصلات">مواصلات</option>
            <option value="فواتير">فواتير</option>
            <option value="ترفيه">ترفيه</option>
            <option value="أخرى">أخرى</option>
        </select>
    </div>
    
    <button onclick="addExpense()">حفظ المصروف</button>
    
    <div class="total" id="totalDisplay">إجمالي المصروفات: 0.00 ج.م</div>
    
    <table>
        <thead>
            <tr>
                <th>البيان</th>
                <th>المبلغ</th>
                <th>التصنيف</th>
                <th>التاريخ</th>
                <th>حذف</th>
            </tr>
        </thead>
        <tbody id="expenseTable">
        </tbody>
    </table>
</div>

<script>
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

    function saveAndRender() {
        localStorage.setItem('expenses', JSON.stringify(expenses));
        renderExpenses();
    }

    function addExpense() {
        const title = document.getElementById('title').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const category = document.getElementById('category').value;

        if (!title || isNaN(amount) || amount <= 0) {
            alert('الرجاء إدخال بيانات صحيحة!');
            return;
        }

        // الحصول على التاريخ والوقت الحالي بتنسيق جميل
        const now = new Date();
        const dateString = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});

        const expense = {
            id: Date.now(),
            title: title,
            amount: amount,
            category: category,
            date: dateString
        };

        expenses.unshift(expense); // إضافة المصروف الجديد في أعلى القائمة
        document.getElementById('title').value = '';
        document.getElementById('amount').value = '';
        
        saveAndRender();
    }

    function deleteExpense(id) {
        expenses = expenses.filter(exp => exp.id !== id);
        saveAndRender();
    }

    function renderExpenses() {
        const tableBody = document.getElementById('expenseTable');
        tableBody.innerHTML = '';
        let total = 0;

        expenses.forEach(exp => {
            total += exp.amount;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${exp.title}</td>
                <td>${exp.amount.toFixed(2)}</td>
                <td>${exp.category}</td>
                <td>${exp.date || 'بدون تاريخ'}</td>
                <td><button class="delete-btn" onclick="deleteExpense(${exp.id})">حذف</button></td>
            `;
            tableBody.appendChild(row);
        });

        document.getElementById('totalDisplay').innerText = `إجمالي المصروفات: ${total.toFixed(2)} ج.م`;
    }

    renderExpenses();
</script>

</body>
</html>
